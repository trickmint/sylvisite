<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#330d2f">
    <title>/go/ - launchpad</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
</head>
<body>
    <audio id="menu-music" loop preload="metadata">
        Your browser does not support background audio.
    </audio>

    <main class="page-shell">
        <header class="site-header">
            <div>
                <h1><span id="welcome" class="blur1">hi sylvie!</span></h1>
                <p class="subtitle blur2">what to do today...</p>
            </div>
            <div class="header-actions" aria-label="Page controls">
                <button class="icon-button" id="music-toggle" type="button" aria-pressed="false">
                    <span aria-hidden="true" id="music-icon">○</span>
                    <span id="music-label">music</span>
                </button>
                <button class="icon-button" id="edit-launchers" type="button" aria-pressed="false">
                    <span aria-hidden="true">✎</span> <span id="edit-launchers-label">edit launchers</span>
                </button>
            </div>
        </header>

        <section class="favorites-section" aria-labelledby="favorites-heading">
            <div class="section-heading">
                <div>
                    <h2 id="favorites-heading">favorites</h2>
                </div>
                <span class="count-pill" id="favorite-count">0</span>
            </div>
            <div class="launcher-grid" id="favorites-grid"></div>
            <p class="empty-state" id="favorites-empty" hidden>No favorites yet. Add one below and star it for quick access.</p>
        </section>

        <section class="categories-section" aria-labelledby="categories-heading">
            <div class="section-heading">
                <div>
                    <h2 id="categories-heading">all categories</h2>
                </div>
            </div>
            <div id="categories"></div>
        </section>
    </main>

    <dialog id="launcher-dialog">
        <form id="launcher-form" method="dialog">
            <div class="dialog-heading">
                <div>
                    <p class="eyebrow">customize your launchpad</p>
                    <h2 id="dialog-title">add launcher</h2>
                </div>
                <button class="close-button" id="close-dialog" type="button" aria-label="Close dialog">×</button>
            </div>
            <input id="launcher-id" type="hidden">
            <label>
                Name
                <input id="launcher-name" name="name" type="text" maxlength="40" required autocomplete="off" placeholder="my game">
            </label>
            <label>
                Link
                <input id="launcher-url" name="url" type="text" inputmode="url" required placeholder="example.com or steam://rungameid/...">
            </label>
            <p class="field-help">Steam links work when Steam is installed. You can also use regular https:// links.</p>
            <div class="form-row">
                <label>
                    Category
                    <input id="launcher-category" name="category" type="text" maxlength="30" required list="category-suggestions" placeholder="games">
                    <datalist id="category-suggestions"></datalist>
                </label>
                <label>
                    Icon
                    <input id="launcher-icon" name="icon" type="hidden" value="🌟">
                    <button class="emoji-picker-toggle" id="emoji-picker-toggle" type="button"
                        aria-expanded="false" aria-controls="emoji-picker-options">🌟 <span>choose emoji</span></button>
                    <span class="emoji-picker-options" id="emoji-picker-options" role="listbox"
                        aria-label="Launcher icon choices"></span>
                </label>
            </div>
            <label class="checkbox-label">
                <input id="launcher-favorite" name="favorite" type="checkbox">
                <span>Show in favorites</span>
            </label>
            <p class="form-error" id="form-error" role="alert" hidden></p>
            <div class="dialog-actions">
                <button class="text-button danger-button" id="delete-launcher" type="button" hidden>delete</button>
                <span></span>
                <button class="text-button" id="cancel-dialog" type="button">cancel</button>
                <button class="primary-button" type="submit">save launcher</button>
            </div>
        </form>
    </dialog>

    <script>
        const defaultLaunchers = [
            {
                id: "template-bloxstrap",
                name: "template, bloxstrap",
                url: "steam://rungameid/13647909575561576448",
                category: "games",
                icon: "🌟",
                favorite: true
            }
        ];
        const launcherStorageKey = "sylvisite-go-launchers";
        const categoryOrderStorageKey = "sylvisite-go-category-order";
        const favoriteOrderStorageKey = "sylvisite-go-favorite-order";
        const musicStorageKey = "sylvisite-go-music-muted";
        const launcherIcons = [
            "🌟", "🎮", "🕹️", "👾", "🎲", "🧩", "🏆", "⚔️", "🛡️", "🚀",
            "🎯", "🧙", "🐉", "👻", "🤖", "🧱", "🎨", "🎵", "🎧", "🎤",
            "📻", "📺", "🎬", "📷", "🖼️", "🌐", "💬", "📧", "📱", "💻",
            "⌨️", "🖱️", "🛠️", "⚙️", "🔧", "🔨", "🧰", "🧪", "📁", "📂",
            "📝", "📚", "🔖", "🔍", "💡", "🔗", "⭐", "🌟", "💖", "🔥",
            "🌈", "🌙", "☀️", "☁️", "🌸", "🍀", "🌻", "🐱", "🐶", "🦊",
            "🍎", "🍕", "☕", "🍵", "🥤", "🏠", "🗺️", "✈️", "🚗", "🚲"
        ];
        const menuMusic = document.getElementById("menu-music");
        const dialog = document.getElementById("launcher-dialog");
        const form = document.getElementById("launcher-form");
        let emojiPickerRendered = false;
        let launchers = loadLaunchers();
        let categoryOrder = loadCategoryOrder();
        let favoriteOrder = loadFavoriteOrder();
        let editMode = false;
        let shiftHeld = false;

        function loadLaunchers() {
            try {
                const saved = JSON.parse(localStorage.getItem(launcherStorageKey));
                return Array.isArray(saved) ? saved : structuredClone(defaultLaunchers);
            } catch (error) {
                console.warn("Could not load saved launchers.", error);
                return structuredClone(defaultLaunchers);
            }
        }

        function saveLaunchers() {
            localStorage.setItem(launcherStorageKey, JSON.stringify(launchers));
        }

        function loadCategoryOrder() {
            try {
                const saved = JSON.parse(localStorage.getItem(categoryOrderStorageKey));
                return Array.isArray(saved) ? saved : [];
            } catch (error) {
                console.warn("Could not load saved category order.", error);
                return [];
            }
        }

        function saveCategoryOrder() {
            localStorage.setItem(categoryOrderStorageKey, JSON.stringify(categoryOrder));
        }

        function loadFavoriteOrder() {
            try {
                const saved = JSON.parse(localStorage.getItem(favoriteOrderStorageKey));
                return Array.isArray(saved) ? saved : [];
            } catch (error) {
                console.warn("Could not load saved favorite order.", error);
                return [];
            }
        }

        function saveFavoriteOrder() {
            localStorage.setItem(favoriteOrderStorageKey, JSON.stringify(favoriteOrder));
        }

        function getOrderedFavorites() {
            const favoriteIds = launchers.filter((launcher) => launcher.favorite).map((launcher) => launcher.id);
            const savedFavorites = favoriteOrder.filter((id) => favoriteIds.includes(id));
            const newFavorites = favoriteIds.filter((id) => !savedFavorites.includes(id));
            favoriteOrder = [...savedFavorites, ...newFavorites];
            saveFavoriteOrder();
            return favoriteOrder
                .map((id) => launchers.find((launcher) => launcher.id === id))
                .filter(Boolean);
        }

        function setEditMode(enabled) {
            editMode = enabled;
            document.body.classList.toggle("edit-mode", editMode);
            const editButton = document.getElementById("edit-launchers");
            editButton.setAttribute("aria-pressed", String(editMode));
            document.getElementById("edit-launchers-label").textContent = editMode ? "done editing" : "edit launchers";
            renderLaunchers();
        }

        function setShiftHeld(held) {
            shiftHeld = held;
            document.body.classList.toggle("shift-held", shiftHeld);
            document.querySelectorAll(".category-move-button").forEach((button) => {
                button.hidden = !shiftHeld;
            });
        }

        function getOrderedCategories(grouped) {
            const currentCategories = Object.keys(grouped);
            const savedCategories = categoryOrder.filter((category) => currentCategories.includes(category));
            const newCategories = currentCategories
                .filter((category) => !savedCategories.includes(category))
                .sort((a, b) => a.localeCompare(b));
            categoryOrder = [...savedCategories, ...newCategories];
            saveCategoryOrder();
            return categoryOrder;
        }

        function renderCategorySuggestions(categories) {
            const suggestions = document.getElementById("category-suggestions");
            suggestions.replaceChildren(...categories.map((category) => {
                const option = document.createElement("option");
                option.value = category;
                return option;
            }));
        }

        function renderEmojiPicker() {
            if (emojiPickerRendered) return;
            const picker = document.getElementById("emoji-picker-options");
            const fragment = document.createDocumentFragment();
            launcherIcons.forEach((icon) => {
                const option = document.createElement("button");
                option.type = "button";
                option.className = "emoji-option";
                option.textContent = icon;
                option.setAttribute("role", "option");
                option.setAttribute("aria-label", `Use ${icon} as launcher icon`);
                option.dataset.icon = icon;
                fragment.append(option);
            });
            picker.replaceChildren(fragment);
            emojiPickerRendered = true;
        }

        function setSelectedIcon(icon) {
            const selectedIcon = launcherIcons.includes(icon) ? icon : "🌟";
            document.getElementById("launcher-icon").value = selectedIcon;
            document.getElementById("emoji-picker-toggle").firstChild.textContent = `${selectedIcon} `;
            document.querySelectorAll(".emoji-option").forEach((option) => {
                option.classList.toggle("is-selected", option.dataset.icon === selectedIcon);
                option.setAttribute("aria-selected", String(option.dataset.icon === selectedIcon));
            });
        }

        function makeLauncherCard(launcher, inFavorites = false) {
            const card = document.createElement("article");
            card.className = "launcher-card";
            if (editMode && inFavorites) {
                card.draggable = true;
                card.dataset.favoriteId = launcher.id;
            }
            card.innerHTML = `
                <a href="${escapeAttribute(launcher.url)}">
                    <span class="launcher-icon" aria-hidden="true">${escapeHtml(launcherIcons.includes(launcher.icon) ? launcher.icon : "🌟")}</span>
                    <span class="launcher-name">${escapeHtml(launcher.name)}</span>
                </a>
                <button class="edit-button" type="button" aria-label="Edit ${escapeAttribute(launcher.name)}"
                    data-action="edit" data-id="${launcher.id}">edit</button>
                <button class="favorite-button ${launcher.favorite ? "is-favorite" : ""}" type="button"
                    aria-label="${launcher.favorite ? "Remove from" : "Add to"} favorites"
                    aria-pressed="${launcher.favorite}" data-action="favorite" data-id="${launcher.id}">★</button>`;
            return card;
        }

        function renderLaunchers() {
            const favoritesGrid = document.getElementById("favorites-grid");
            const favorites = getOrderedFavorites();
            favoritesGrid.replaceChildren(...favorites.map((launcher) => makeLauncherCard(launcher, true)));
            document.getElementById("favorite-count").textContent = favorites.length;
            document.getElementById("favorites-empty").hidden = favorites.length > 0;

            const categories = document.getElementById("categories");
            const grouped = launchers.reduce((groups, launcher) => {
                const category = launcher.category.trim() || "uncategorized";
                (groups[category] ||= []).push(launcher);
                return groups;
            }, {});
            const orderedCategories = getOrderedCategories(grouped);
            renderCategorySuggestions(orderedCategories);
            categories.replaceChildren(...orderedCategories.map((category) => {
                const items = grouped[category];
                const section = document.createElement("details");
                section.className = "category";
                section.open = true;
                section.draggable = editMode;
                section.dataset.category = category;
                section.innerHTML = `
                    <summary>
                        <span class="category-title"><span class="drag-handle" hidden aria-hidden="true">⠿</span>${escapeHtml(category)}</span>
                        <span class="category-actions">
                            <button class="category-move-button" hidden type="button" data-category-action="up" aria-label="Move ${escapeAttribute(category)} up">↑</button>
                            <button class="category-move-button" hidden type="button" data-category-action="down" aria-label="Move ${escapeAttribute(category)} down">↓</button>
                            <span class="category-count">${items.length}</span>
                        </span>
                    </summary>`;
                const grid = document.createElement("div");
                grid.className = "launcher-grid category-grid";
                grid.append(...items.map(makeLauncherCard));
                grid.append(makeAddLauncherButton(category));
                section.append(grid);
                section.querySelector(".drag-handle").hidden = !editMode;
                return section;
            }));
            if (orderedCategories.length === 0) categories.append(makeAddLauncherButton());
        }

        function makeAddLauncherButton(category) {
            const button = document.createElement("button");
            button.className = "add-launcher-button";
            button.type = "button";
            button.setAttribute("aria-label", "Add launcher");
            button.textContent = "+";
            button.addEventListener("click", () => openEditor(undefined, category));
            return button;
        }

        function moveCategory(category, direction) {
            const index = categoryOrder.indexOf(category);
            const targetIndex = index + direction;
            if (index < 0 || targetIndex < 0 || targetIndex >= categoryOrder.length) return;
            [categoryOrder[index], categoryOrder[targetIndex]] = [categoryOrder[targetIndex], categoryOrder[index]];
            saveCategoryOrder();
            renderLaunchers();
        }

        function finishCategoryDrag(target, source) {
            if (!source || !target || source === target) return;
            const sourceIndex = categoryOrder.indexOf(source);
            const targetIndex = categoryOrder.indexOf(target);
            if (sourceIndex < 0 || targetIndex < 0) return;
            categoryOrder.splice(sourceIndex, 1);
            categoryOrder.splice(targetIndex, 0, source);
            saveCategoryOrder();
            renderLaunchers();
        }

        function finishFavoriteDrag(targetId, sourceId) {
            if (!sourceId || !targetId || sourceId === targetId) return;
            const sourceIndex = favoriteOrder.indexOf(sourceId);
            const targetIndex = favoriteOrder.indexOf(targetId);
            if (sourceIndex < 0 || targetIndex < 0) return;
            favoriteOrder.splice(sourceIndex, 1);
            favoriteOrder.splice(targetIndex, 0, sourceId);
            saveFavoriteOrder();
            renderLaunchers();
        }

        function escapeHtml(value) {
            const element = document.createElement("span");
            element.textContent = value;
            return element.innerHTML;
        }

        function escapeAttribute(value) {
            return escapeHtml(value).replace(/"/g, "&quot;");
        }

        function openEditor(launcher, category) {
            form.reset();
            document.getElementById("emoji-picker-options").classList.remove("is-open");
            document.getElementById("emoji-picker-toggle").setAttribute("aria-expanded", "false");
            document.getElementById("launcher-id").value = launcher?.id || "";
            document.getElementById("launcher-name").value = launcher?.name || "";
            document.getElementById("launcher-url").value = launcher?.url || "";
            document.getElementById("launcher-category").value = launcher?.category || category || "games";
            const icon = launcherIcons.includes(launcher?.icon) ? launcher.icon : "🌟";
            setSelectedIcon(icon);
            document.getElementById("launcher-favorite").checked = launcher?.favorite || false;
            document.getElementById("dialog-title").textContent = launcher ? "edit launcher" : "add launcher";
            document.getElementById("delete-launcher").hidden = !launcher;
            document.getElementById("form-error").hidden = true;
            dialog.showModal();
            document.getElementById("launcher-name").focus();
        }

        function closeEditor() {
            document.getElementById("emoji-picker-options").classList.remove("is-open");
            document.getElementById("emoji-picker-toggle").setAttribute("aria-expanded", "false");
            if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
            dialog.close();
        }

        document.addEventListener("click", (event) => {
            const iconOption = event.target.closest("[data-icon]");
            if (iconOption) {
                setSelectedIcon(iconOption.dataset.icon);
                document.getElementById("emoji-picker-options").classList.remove("is-open");
                document.getElementById("emoji-picker-toggle").setAttribute("aria-expanded", "false");
                return;
            }
            if (!event.target.closest(".emoji-picker-toggle, .emoji-picker-options")) {
                document.getElementById("emoji-picker-options").classList.remove("is-open");
                document.getElementById("emoji-picker-toggle").setAttribute("aria-expanded", "false");
            }
            const categoryButton = event.target.closest("[data-category-action]");
            if (categoryButton && editMode) {
                event.preventDefault();
                event.stopPropagation();
                const category = categoryButton.closest(".category").dataset.category;
                moveCategory(category, categoryButton.dataset.categoryAction === "up" ? -1 : 1);
                return;
            }
            const editButton = event.target.closest("[data-action='edit']");
            if (editButton) {
                const launcher = launchers.find((item) => item.id === editButton.dataset.id);
                if (launcher) openEditor(launcher);
                return;
            }
            const favoriteButton = event.target.closest("[data-action='favorite']");
            if (!favoriteButton) return;
            const launcher = launchers.find((item) => item.id === favoriteButton.dataset.id);
            if (!launcher) return;
            launcher.favorite = !launcher.favorite;
            saveLaunchers();
            renderLaunchers();
        });

        document.addEventListener("dragstart", (event) => {
            const favorite = event.target.closest("[data-favorite-id]");
            if (editMode && favorite) {
                event.dataTransfer.effectAllowed = "move";
                event.dataTransfer.setData("text/favorite-id", favorite.dataset.favoriteId);
                favorite.classList.add("is-dragging");
                return;
            }
            const category = event.target.closest(".category");
            if (!editMode || !category) return;
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", category.dataset.category);
            category.classList.add("is-dragging");
        });

        document.addEventListener("dragover", (event) => {
            const favorite = event.target.closest("[data-favorite-id]");
            if (editMode && favorite) {
                event.preventDefault();
                favorite.classList.add("is-drag-over");
                return;
            }
            const category = event.target.closest(".category");
            if (!editMode || !category) return;
            event.preventDefault();
            category.classList.add("is-drag-over");
        });

        document.addEventListener("dragleave", (event) => {
            const favorite = event.target.closest("[data-favorite-id]");
            if (favorite && !favorite.contains(event.relatedTarget)) favorite.classList.remove("is-drag-over");
            const category = event.target.closest(".category");
            if (editMode && category && !category.contains(event.relatedTarget)) category.classList.remove("is-drag-over");
        });

        document.addEventListener("drop", (event) => {
            const favorite = event.target.closest("[data-favorite-id]");
            if (editMode && favorite) {
                event.preventDefault();
                finishFavoriteDrag(favorite.dataset.favoriteId, event.dataTransfer.getData("text/favorite-id"));
                return;
            }
            const category = event.target.closest(".category");
            if (!editMode || !category) return;
            event.preventDefault();
            finishCategoryDrag(category.dataset.category, event.dataTransfer.getData("text/plain"));
        });

        document.addEventListener("dragend", () => {
            document.querySelectorAll("[data-favorite-id]").forEach((favorite) => {
                favorite.classList.remove("is-dragging", "is-drag-over");
            });
            document.querySelectorAll(".category").forEach((category) => {
                category.classList.remove("is-dragging", "is-drag-over");
            });
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Shift") setShiftHeld(true);
            if (!event.repeat && event.shiftKey && event.key.toLowerCase() === "e") {
                event.preventDefault();
                setEditMode(!editMode);
            }
        });

        document.addEventListener("keyup", (event) => {
            if (event.key === "Shift") setShiftHeld(false);
        });

        window.addEventListener("blur", () => setShiftHeld(false));

        document.getElementById("emoji-picker-toggle").addEventListener("click", () => {
            const picker = document.getElementById("emoji-picker-options");
            renderEmojiPicker();
            const isOpen = picker.classList.toggle("is-open");
            document.getElementById("emoji-picker-toggle").setAttribute("aria-expanded", String(isOpen));
        });
        document.getElementById("edit-launchers").addEventListener("click", () => setEditMode(!editMode));
        document.getElementById("cancel-dialog").addEventListener("click", closeEditor);
        document.getElementById("close-dialog").addEventListener("click", closeEditor);
        dialog.addEventListener("click", (event) => {
            if (event.target === dialog) closeEditor();
        });

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const id = document.getElementById("launcher-id").value || `launcher-${Date.now()}`;
            const name = document.getElementById("launcher-name").value.trim();
            const enteredUrl = document.getElementById("launcher-url").value.trim();
            const url = /^[a-z][a-z\d+\-.]*:/i.test(enteredUrl) ? enteredUrl : `https://${enteredUrl}`;
            const category = document.getElementById("launcher-category").value.trim();
            const urlIsAllowed = /^(https?:|steam:)/i.test(url);
            if (!name || !category || !urlIsAllowed) {
                const error = document.getElementById("form-error");
                error.textContent = "Please enter a name, category, and an https:// or steam:// link.";
                error.hidden = false;
                return;
            }
            const launcher = {
                id,
                name,
                url,
                category,
                icon: launcherIcons.includes(document.getElementById("launcher-icon").value)
                    ? document.getElementById("launcher-icon").value
                    : "🌟",
                favorite: document.getElementById("launcher-favorite").checked
            };
            const existingIndex = launchers.findIndex((item) => item.id === id);
            if (existingIndex >= 0) launchers[existingIndex] = launcher;
            else launchers.push(launcher);
            saveLaunchers();
            renderLaunchers();
            closeEditor();
        });

        document.getElementById("delete-launcher").addEventListener("click", () => {
            const id = document.getElementById("launcher-id").value;
            if (!id || !confirm("Delete this launcher?")) return;
            launchers = launchers.filter((launcher) => launcher.id !== id);
            saveLaunchers();
            renderLaunchers();
            closeEditor();
        });

        function setMusicState(muted) {
            menuMusic.muted = muted;
            document.getElementById("music-toggle").setAttribute("aria-pressed", String(muted));
            document.getElementById("music-icon").textContent = muted ? "×" : "○";
            document.getElementById("music-label").textContent = muted ? "music" : "music";
            localStorage.setItem(musicStorageKey, String(muted));
        }

        document.getElementById("music-toggle").addEventListener("click", () => {
            setMusicState(!menuMusic.muted);
            if (!menuMusic.muted) menuMusic.play().catch(() => {});
        });

        const today = new Date();
        const isBirthday = today.getMonth() === 10 && today.getDate() === 29;
        document.getElementById("welcome").textContent = isBirthday ? "hbd, sylvie!!!" : "hi sylvie!";
        menuMusic.src = isBirthday ? "assets/wii_u_menu-birthday.mp3" : "assets/wii_u_menu-in_use.mp3";
        menuMusic.volume = 0.1;
        const savedMuteState = localStorage.getItem(musicStorageKey) === "true";
        setMusicState(savedMuteState);
        menuMusic.play().catch(() => {
            if (!savedMuteState) {
                document.getElementById("music-label").textContent = "click for music";
            }
        });
        renderLaunchers();
    </script>
</body>
</html>
